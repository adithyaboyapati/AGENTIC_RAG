name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/ tests/ streamlit_app.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          ENVIRONMENT: development
          REQUIRE_API_KEY: "false"
          OPENAI_API_KEY: test-key
        run: pytest tests/ -q

      - name: Import smoke test
        env:
          OPENAI_API_KEY: test-key
        run: python -c "from src.api.server import app; from src.runner import run_agent"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agentic-rag:ci .

      - name: Verify secrets are not baked into the image
        run: |
          if docker run --rm --entrypoint sh agentic-rag:ci -c "ls -la /app/.env* 2>/dev/null | grep -v example"; then
            echo "ERROR: .env file found inside image"
            exit 1
          fi
          echo "OK: no .env files in image"
