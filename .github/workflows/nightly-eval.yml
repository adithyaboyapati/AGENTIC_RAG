name: Nightly retrieval eval

# The CI gate only validates the golden file's schema offline. This job runs
# real retrieval against a freshly ingested index and fails when quality
# regresses — otherwise a chunking or reranker change can tank recall while CI
# stays green.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      min_recall:
        description: "Minimum mean recall@k"
        default: "0.70"
      min_mrr:
        description: "Minimum mean MRR"
        default: "0.50"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      # secrets is not a valid context on jobs.<job_id>.if, so the key check
      # has to happen in a step. Later steps are skipped when it is unset.
      - name: Check for OpenAI API key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY secret is not set; skipping nightly eval."
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pip install -r requirements.txt

      - name: Ingest corpus
        if: steps.key.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Default config points at localhost Redis, which is not on the runner.
          REDIS_URL: ""
        run: python -m src.ingestion.ingest --source data/sample_docs --reset

      - name: Golden-set retrieval metrics
        if: steps.key.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MIN_RECALL: ${{ inputs.min_recall || '0.70' }}
          MIN_MRR: ${{ inputs.min_mrr || '0.50' }}
        run: python -m src.evaluation.retrieval_metrics --gate

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: retrieval-report
          path: eval_results/
          if-no-files-found: ignore
