server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version.
    server_tokens off;

    # Reject oversized bodies before they reach the API.
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers. The CSP is tight because the bundle is self-contained:
    # no external scripts, styles, or fonts are loaded.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Enable once TLS terminates in front of this container:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Inject the server-side key and strip any browser-supplied one, so a
        # client can never present its own credentials to the API.
        proxy_set_header X-API-Key "${API_KEY}";
        # SSE: stream events through instead of buffering them into one blob.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # clients pin themselves to a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
